<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runenwerk · Konto</title><link rel="stylesheet" href="/styles.css"><style>body{background:#101721;color:#eee5d4;font:16px system-ui}.wrap{max-width:850px;margin:auto;padding:30px}section{background:#1c2938;border:1px solid #405269;border-radius:12px;padding:24px;margin:16px 0}input,button{padding:12px;margin:8px;border-radius:7px;border:1px solid #66788d}input{background:#101721;color:white}button{background:#d5a764;color:#121b29;cursor:pointer}button:disabled{opacity:.4}a{color:#e8b97b}</style><style>body{background:#f3f0e9!important;color:#242323!important;font-family:Arial,Helvetica,sans-serif!important}.wrap{max-width:900px;margin:auto;padding:30px 18px}h1,h2{font-family:Georgia,serif;color:#292625}h1{border-bottom:3px solid #812b29;padding-bottom:18px}section{background:#fffdf9;border:1px solid #d2cec5;border-radius:3px;margin:18px 0;padding:24px}a{color:#812b29}input{border:1px solid #a8a197;border-radius:3px;background:#fff;color:#222;padding:12px}button{background:#812b29;color:white;border:1px solid #812b29;border-radius:3px;padding:11px 16px;cursor:pointer}button:disabled{opacity:.4}</style><main class="wrap"><h1>Runenwerk – Mein Konto</h1><a href="/">Zur Rätselplattform</a><p id="msg"></p><section id="auth"><h2>Anmelden</h2><form id="login"><input name="email" type="email" placeholder="E-Mail" required><input name="password" type="password" placeholder="Passwort" required><button>Anmelden</button></form><h2>Registrieren</h2><form id="register"><input name="name" placeholder="Spielername" required><input name="email" type="email" placeholder="E-Mail" required><input name="password" type="password" minlength="8" placeholder="Passwort" required><button>Konto erstellen</button></form></section><div id="dashboard" hidden><section><h2 id="hello"></h2><p id="plan"></p><button id="logout">Abmelden</button></section><section><h2>Meine Gruppen</h2><div id="groups"></div></section><section><h2>Gruppe erstellen (Premium)</h2><form id="create"><input name="name" placeholder="Gruppenname" minlength="3" required><button id="createBtn">Erstellen</button></form></section><section><h2>Gruppe beitreten (kostenlos)</h2><form id="join"><input name="code" placeholder="Einladungscode" required><button>Beitreten</button></form></section></div></main><script type="module" src="/account.js"></script>
